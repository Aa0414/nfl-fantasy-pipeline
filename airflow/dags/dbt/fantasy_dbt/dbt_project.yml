name: 'fantasy_dbt'
version: '1.0.0'
config-version: 2
profile: 'fantasy_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

models:
  fantasy_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: staging      # prod: lives next to staging, no new dataset needed
    marts:
      +materialized: table
      +schema: mart
